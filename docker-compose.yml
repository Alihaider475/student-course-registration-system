services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: course-registration-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: course_registration
    volumes:
      # Named volume so data survives container restarts
      - postgres_data:/var/lib/postgresql/data
      # Loaded automatically the first time the database starts
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_registration"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js Express backend API
  backend:
    build: ./backend
    container_name: course-registration-backend
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: course_registration
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # React Vite frontend
  frontend:
    build: ./frontend
    container_name: course-registration-frontend
    environment:
      VITE_API_URL: http://YOUR_EC2_PUBLIC_IP:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: